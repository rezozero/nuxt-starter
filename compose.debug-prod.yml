# docker compose -f compose.prod.yml up --force-recreate
services:
    node:
        build:
            context: .
            target: node-prod
            secrets:
                - npm_token
                - npm_registry_url
        mem_limit: 512m
        ports:
            -   3000:3000
        tmpfs:
            - /tmp
        environment:
            # Use internal docker address for SSR fetches and avoid loop-back
            NUXT_SERVER_API_URL: http://api.internal
            NUXT_PUBLIC_API_URL: http://localhost:8088
            NUXT_PUBLIC_API_ENDPOINT_PREFIX: /api
            NUXT_PUBLIC_INTERVENTION_REQUEST_BASE_URL: http://localhost:8088/assets
            NUXT_PUBLIC_INTERVENTION_REQUEST_NO_PROCESS_BASE_URL: http://localhost:8088/assets/n
            NUXT_PUBLIC_INTERVENTION_REQUEST_IMAGES_PATH: /files

# Only needed by @events-api/javascript-sdk, read from the shell or `.env`
secrets:
    npm_token:
        environment: EVENTS_API_NPM_TOKEN
    npm_registry_url:
        environment: EVENTS_API_NPM_REGISTRY_URL
